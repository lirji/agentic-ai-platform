[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agentic-ai-runtime"
version = "0.1.0"
description = "独立知识平台的 AI 运行时与受控模型适配"
requires-python = ">=3.12,<3.13"
dependencies = [
  "deepagents==0.7.28",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "langchain-openai==1.7.2",
  "langgraph==1.2.16",
  "langgraph-checkpoint-postgres==3.2.0",
  "llama-index-core==0.14.25",
  "pydantic>=2.10,<3",
  "psycopg[binary,pool]==3.3.6",
  "pyjwt[crypto]>=2.10,<3",
  "uvicorn>=0.35,<1",
]

[project.scripts]
agentic-ai = "agentic_ai.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8,<10",
  "ruff>=0.13,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_ai"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
- /etc/agentic-monitoring/alerts.yaml
scrape_configs:
- job_name: agentic
  scrape_timeout: 10s
  metrics_path: /actuator/prometheus
  static_configs:
  - targets:
    - 127.0.0.1:29084
    labels:
      service: knowledge
  - targets:
    - 127.0.0.1:29087
    labels:
      service: tasks
- job_name: agentic-legacy
  metrics_path: /metrics
  static_configs:
  - targets:
    - host.docker.internal:29192
    labels:
      service: legacy-budget
  relabel_configs:
  - target_label: job
    replacement: agentic
alerting:
  alertmanagers:
  - static_configs:
    - targets: ["127.0.0.1:9093"]

name: Backend CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'refactor/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: microsoft
          java-version: '21.0.11'
      # 默认生命周期不启用 integration profile，不读取任何本地数据库/模型凭据。
      - name: Build and test Java contracts
        run: mvn -B -ntp verify

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai-runtime
    env:
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 工程知识金标校验固定历史提交的原文，浅克隆缺少该 Git 对象。
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.3'
          python-version: '3.12'
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Format and static checks
        run: |
          uv run --frozen ruff format --check src tests
          uv run --frozen ruff check src tests
          uv run --frozen mypy
      - name: Unit and shared wire contracts
        run: uv run --frozen pytest
      - name: Quality baseline and attack runner static checks
        run: |
          uv run --frozen ruff format --check ../deploy/quality_security.py ../deploy/quality_security_runtime.py
          uv run --frozen ruff check ../deploy/quality_security.py ../deploy/quality_security_runtime.py
          uv run --frozen python -m py_compile ../deploy/quality_security.py ../deploy/quality_security_runtime.py
          uv run --frozen python ../deploy/quality_security.py verify

  documents:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check registered contract evidence
        run: |
          python3 ci/check_contract_docs.py
          python3 ci/check_usage_boundaries.py
          python3 -m py_compile deploy/docker/runtime.py deploy/docker/search_bridge.py
          python3 -m compileall -q deploy/docker
          python3 -m unittest discover -s deploy/docker -p 'test_*.py'
          python3 -m unittest discover -s deploy -p 'test_memory_local.py'
          git show --format= --check HEAD

  operational-alerts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify read-only legacy budget observer
        run: python3 -m unittest discover -s deploy/monitoring -p 'test_*.py'
      - name: Verify alert trigger, recovery and replica aggregation
        run: |
          docker run --rm --network none -v "$PWD/deploy/monitoring:/etc/agentic-monitoring:ro" --workdir /etc/agentic-monitoring --entrypoint /bin/promtool prom/prometheus@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94 check config prometheus.yaml
          docker run --rm --network none -v "$PWD/deploy/monitoring:/etc/agentic-monitoring:ro" --workdir /etc/agentic-monitoring --entrypoint /bin/promtool prom/prometheus@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94 test rules alerts.test.yaml

spring:
  application:
    name: agentic-knowledge
  datasource:
    url: ${KNOWLEDGE_DB_URL}
    username: ${KNOWLEDGE_DB_USER}
    password: ${KNOWLEDGE_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${KNOWLEDGE_DB_POOL_SIZE:10}
      minimum-idle: 1
      connection-timeout: 3000
      validation-timeout: 1000
      data-source-properties:
        connectTimeout: 3000
        socketTimeout: 5000
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  flyway:
    user: ${KNOWLEDGE_MIGRATION_USER}
    password: ${KNOWLEDGE_MIGRATION_PASSWORD}
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
      file-size-threshold: 0
  lifecycle:
    timeout-per-shutdown-phase: 10s
server:
  address: ${KNOWLEDGE_BIND_ADDRESS:127.0.0.1}
  port: ${KNOWLEDGE_PORT:28084}
  shutdown: graceful
  tomcat:
    threads:
      max: ${KNOWLEDGE_HTTP_THREADS:64}
      min-spare: 4
    max-connections: 128
    accept-count: 32
    connection-timeout: 5s
  error:
    include-message: never
    include-stacktrace: never
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
    default-statement-timeout: 5
  global-config:
    banner: false
knowledge:
  lifecycle:
    create-enabled: ${KNOWLEDGE_LIFECYCLE_CREATE_ENABLED:true}
    generation-enabled: ${KNOWLEDGE_LIFECYCLE_GENERATION_ENABLED:false}
    updates-enabled: ${KNOWLEDGE_LIFECYCLE_UPDATES_ENABLED:false}
    withdrawals-enabled: ${KNOWLEDGE_LIFECYCLE_WITHDRAWALS_ENABLED:false}
    deletions-enabled: ${KNOWLEDGE_LIFECYCLE_DELETIONS_ENABLED:false}
    backfill-enabled: ${KNOWLEDGE_LIFECYCLE_BACKFILL_ENABLED:false}
  citation-reader:
    enabled: ${KNOWLEDGE_CITATION_READER_ENABLED:false}
    public-key: ${KNOWLEDGE_CITATION_READER_PUBLIC_KEY:}
  admission:
    structured-profile: ${KNOWLEDGE_STRUCTURED_PROFILE:BLOCK_V2}
  parsing:
    enabled: ${KNOWLEDGE_PARSING_ENABLED:false}
    pdf-upload-enabled: ${KNOWLEDGE_PDF_UPLOAD_ENABLED:false}
    docx-upload-enabled: ${KNOWLEDGE_DOCX_UPLOAD_ENABLED:false}
    java-executable: ${KNOWLEDGE_PARSER_JAVA:}
    jar: ${KNOWLEDGE_PARSER_JAR:}
  evaluation:
    enabled: ${KNOWLEDGE_EVALUATION_ENABLED:false}
    task-endpoint: ${KNOWLEDGE_EVALUATION_TASK_ENDPOINT:http://127.0.0.1:28087}
    task-public-key: ${KNOWLEDGE_EVALUATION_TASK_PUBLIC_KEY:}
    task-private-key: ${KNOWLEDGE_EVALUATION_TASK_PRIVATE_KEY:}
    worker-public-key: ${KNOWLEDGE_EVALUATION_WORKER_PUBLIC_KEY:}
    worker-enabled: ${KNOWLEDGE_EVALUATION_WORKER_ENABLED:false}
    worker-tenant: ${KNOWLEDGE_EVALUATION_WORKER_TENANT:}
    poll-seconds: ${KNOWLEDGE_EVALUATION_POLL_SECONDS:2}
  runtime:
    enabled: ${KNOWLEDGE_RUNTIME_ENABLED:false}
    public-key: ${KNOWLEDGE_RUNTIME_PUBLIC_KEY:}
  processing:
    enabled: ${KNOWLEDGE_PROCESSING_ENABLED:false}
    worker-enabled: ${KNOWLEDGE_WORKER_ENABLED:false}
    worker-tenant: ${KNOWLEDGE_WORKER_TENANT:}
    ai-endpoint: ${KNOWLEDGE_AI_ENDPOINT:http://127.0.0.1:28085}
    private-key: ${KNOWLEDGE_AI_PRIVATE_KEY:}
    public-key: ${KNOWLEDGE_AI_PUBLIC_KEY:}
    qdrant-endpoint: ${KNOWLEDGE_QDRANT_ENDPOINT:http://127.0.0.1:26333}
    qdrant-key: ${KNOWLEDGE_QDRANT_KEY:}
    collection: ${KNOWLEDGE_QDRANT_COLLECTION:agentic_knowledge_text_v1}
    elastic-endpoint: ${KNOWLEDGE_ELASTIC_ENDPOINT:http://127.0.0.1:29200}
    elastic-user: ${KNOWLEDGE_ELASTIC_USER:}
    elastic-password: ${KNOWLEDGE_ELASTIC_PASSWORD:}
    index: ${KNOWLEDGE_ELASTIC_INDEX:agentic-knowledge-text-v1}
    lease-seconds: ${KNOWLEDGE_LEASE_SECONDS:60}
    heartbeat-seconds: ${KNOWLEDGE_HEARTBEAT_SECONDS:10}
    poll-seconds: ${KNOWLEDGE_POLL_SECONDS:2}
    job-seconds: ${KNOWLEDGE_JOB_SECONDS:120}
    ai-seconds: ${KNOWLEDGE_AI_SECONDS:45}
    index-seconds: ${KNOWLEDGE_INDEX_SECONDS:8}
  transaction-timeout-seconds: ${KNOWLEDGE_TRANSACTION_TIMEOUT_SECONDS:5}
  identity:
    public-key: ${INTERNAL_PUBLIC_KEY}
  source:
    endpoint: ${KNOWLEDGE_S3_ENDPOINT}
    region: ${KNOWLEDGE_S3_REGION:us-east-1}
    bucket: ${KNOWLEDGE_S3_BUCKET}
    access-key: ${KNOWLEDGE_S3_ACCESS_KEY}
    secret-key: ${KNOWLEDGE_S3_SECRET_KEY}
    max-connections: ${KNOWLEDGE_S3_MAX_CONNECTIONS:10}
    connect-timeout-seconds: ${KNOWLEDGE_S3_CONNECT_TIMEOUT_SECONDS:2}
    call-timeout-seconds: ${KNOWLEDGE_S3_CALL_TIMEOUT_SECONDS:10}
management:
  server:
    address: 127.0.0.1
    port: ${KNOWLEDGE_MANAGEMENT_PORT:29084}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,sourceStore,processingDependencies
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  otlp:
    tracing:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:false}
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} trace=%X{traceId:-} span=%X{spanId:-} request=%X{requestId:-} - %msg%n"
